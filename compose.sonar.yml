services:
  sonarqube:
    image: sonarqube:26.8.0.126808-community
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:9000/api/system/status | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  sonar_data:
  sonar_extensions:
  sonar_logs:
